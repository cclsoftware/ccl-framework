<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif">
	<defs>
		<style>
			.card { fill: #242c3f; stroke: #4b5875; stroke-width: 1; stroke-dasharray: 4,3; }
			.outline { fill: none; stroke: #4b5875; stroke-width: 1; stroke-dasharray: 4,3; }
			.warn { fill: none; stroke: #fb7185; stroke-width: 1; stroke-dasharray: 3,3; opacity: 0.6; }
			.heading { font-size: 15px; font-weight: bold; fill: #f1f4f9; text-anchor: middle; }
			.label { font-size: 12px; fill: #c3cbdb; text-anchor: middle; }
			.caption { font-size: 10.5px; fill: #8b93a8; text-anchor: middle; }
		</style>
		<!-- rects below are inset by half their stroke width so the stroke stays within the symbol's own bounds instead of being clipped by it -->
		<symbol id="pic-icon" viewBox="0 0 70 50" preserveAspectRatio="none">
			<rect x="0.75" y="0.75" width="68.5" height="48.5" fill="#202737" stroke="#4b5875" stroke-width="1.5"/>
			<circle cx="14" cy="14" r="6" fill="#fbbf24"/>
			<polygon points="8,42 32,16 46,32" fill="#059669"/>
			<polygon points="34,42 50,22 64,42" fill="#10b981"/>
		</symbol>
		<symbol id="panel" viewBox="0 0 160 80" width="160" height="80">
			<rect x="0.5" y="0.5" width="159" height="79" class="card"/>
		</symbol>
		<radialGradient id="demo-radial" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#818cf8"/>
			<stop offset="100%" stop-color="#22d3ee"/>
		</radialGradient>
		<clipPath id="clip-cover-image"><rect x="700" y="60" width="160" height="80"/></clipPath>
		<clipPath id="clip-cover-gradient"><rect x="480" y="240" width="160" height="80"/></clipPath>
	</defs>

	<rect x="1" y="1" width="898" height="368" fill="#1b2130" stroke="#4b5875" stroke-width="2"/>

	<text x="450" y="24" class="heading">Image, depending on isContentFit / isContentFill</text>

	<!-- none: kept at its own natural size, centered -->
	<text x="120" y="52" class="label">none</text>
	<use href="#panel" x="40" y="60"/>
	<use href="#pic-icon" x="85" y="75" width="70" height="50"/>

	<!-- fit: contain, letterboxed -->
	<text x="340" y="52" class="label">fit</text>
	<use href="#panel" x="260" y="60"/>
	<use href="#pic-icon" x="284" y="60" width="112" height="80"/>

	<!-- fill: stretched to match exactly, distorting the aspect ratio -->
	<text x="560" y="52" class="label">fill</text>
	<use href="#panel" x="480" y="60"/>
	<use href="#pic-icon" x="480" y="60" width="160" height="80"/>

	<!-- fit + fill: cover, cropped -->
	<text x="780" y="52" class="label">fit + fill</text>
	<rect x="700" y="42.86" width="160" height="114.29" class="warn"/>
	<g clip-path="url(#clip-cover-image)">
		<rect x="700" y="60" width="160" height="80" fill="#242c3f"/>
		<use href="#pic-icon" x="700" y="42.86" width="160" height="114.29"/>
	</g>
	<rect x="700.5" y="60.5" width="159" height="79" class="outline"/>

	<text x="450" y="200" class="heading">Radial gradient, depending on isContentFit / isContentFill</text>

	<!-- none -->
	<text x="120" y="232" class="label">none</text>
	<use href="#panel" x="40" y="240"/>
	<circle cx="85" cy="270" r="18" fill="url(#demo-radial)"/>
	<text x="120" y="345" class="caption">kept at its own size and position</text>

	<!-- fit -->
	<text x="340" y="232" class="label">fit</text>
	<use href="#panel" x="260" y="240"/>
	<circle cx="340" cy="280" r="40" fill="url(#demo-radial)"/>
	<text x="340" y="345" class="caption">fully visible, fitted to the area</text>

	<!-- fill (= fit + fill) -->
	<text x="560" y="232" class="label">fill  (same for fit + fill)</text>
	<rect x="480.75" y="240.75" width="158.5" height="78.5" fill="#242c3f" stroke="#4b5875" stroke-width="1.5"/>
	<circle cx="560" cy="280" r="80" class="warn"/>
	<g clip-path="url(#clip-cover-gradient)">
		<circle cx="560" cy="280" r="80" fill="url(#demo-radial)"/>
	</g>
	<rect x="480.5" y="240.5" width="159" height="79" class="outline"/>
	<text x="560" y="345" class="caption">covers the area, cropped</text>
</svg>
